<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="344" viewBox="0 0 1000 344" font-family="Georgia,serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111">Cost of one failed check, by design</text>
<text x="24" y="56" font-size="13" fill="#555">Fail rate 100%, 1,000,000 checks per run, median of 11 runs (log scale)</text>
<text x="318" y="107" font-size="13" text-anchor="end" fill="#222">pre-validation</text>
<rect x="330" y="88" width="35.1" height="28" fill="#3b5b8c"/>
<text x="375.1" y="107" font-size="12.5" fill="#111">0.42 ns</text>
<text x="318" y="153" font-size="13" text-anchor="end" fill="#222">error code -1</text>
<rect x="330" y="134" width="67.7" height="28" fill="#3b5b8c"/>
<text x="407.7" y="153" font-size="12.5" fill="#111">0.98 ns</text>
<text x="318" y="199" font-size="13" text-anchor="end" fill="#222">exception, no stack trace</text>
<rect x="330" y="180" width="240.5" height="28" fill="#3b5b8c"/>
<text x="580.5" y="199" font-size="12.5" fill="#111">10.33 ns</text>
<text x="318" y="245" font-size="13" text-anchor="end" fill="#222">exception, full stack trace</text>
<rect x="330" y="226" width="600.0" height="28" fill="#3b5b8c"/>
<text x="940.0" y="245" font-size="12.5" fill="#111">426.11 ns</text>
<text x="24" y="328" font-size="11.5" fill="#666">Log scale: the full-stack-trace exception is about 1,000x the cost of pre-validation. At a 0% fail rate all four are within 1.4x.</text>
</svg>