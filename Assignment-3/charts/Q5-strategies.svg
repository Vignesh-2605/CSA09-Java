<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="436" viewBox="0 0 1000 436" font-family="Georgia,serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#111">Seat-booking strategies, cost per booking</text>
<text x="24" y="56" font-size="13" fill="#555">10,000 bookings, 8 threads, 2,000 seats, median of 11 runs</text>
<text x="318" y="107" font-size="13" text-anchor="end" fill="#222">synchronized method</text>
<rect x="330" y="88" width="502.2" height="28" fill="#3b5b8c"/>
<text x="842.2" y="107" font-size="12.5" fill="#111">293.98 ns</text>
<text x="318" y="153" font-size="13" text-anchor="end" fill="#222">synchronized block</text>
<rect x="330" y="134" width="220.7" height="28" fill="#3b5b8c"/>
<text x="560.7" y="153" font-size="12.5" fill="#111">129.21 ns</text>
<text x="318" y="199" font-size="13" text-anchor="end" fill="#222">striped per-seat locks</text>
<rect x="330" y="180" width="519.0" height="28" fill="#3b5b8c"/>
<text x="859.0" y="199" font-size="12.5" fill="#111">303.81 ns</text>
<text x="318" y="245" font-size="13" text-anchor="end" fill="#222">AtomicBoolean + CAS</text>
<rect x="330" y="226" width="133.0" height="28" fill="#3b5b8c"/>
<text x="473.0" y="245" font-size="12.5" fill="#111">77.86 ns</text>
<text x="318" y="291" font-size="13" text-anchor="end" fill="#222">ReentrantLock</text>
<rect x="330" y="272" width="157.6" height="28" fill="#3b5b8c"/>
<text x="497.6" y="291" font-size="12.5" fill="#111">92.27 ns</text>
<text x="318" y="337" font-size="13" text-anchor="end" fill="#222">ConcurrentHashMap</text>
<rect x="330" y="318" width="600.0" height="28" fill="#3b5b8c"/>
<text x="940.0" y="337" font-size="12.5" fill="#111">351.25 ns</text>
<text x="24" y="420" font-size="11.5" fill="#666">All six strategies are correct. The unsynchronised version is absent because it is not correct: it oversold in 9 of 40 trials.</text>
</svg>